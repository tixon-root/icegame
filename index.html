<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ICECOIN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b1220;--card:#131c31;--line:#22304d;--ice:#7dd3fc;--txt:#e6f0ff;--mut:#8aa0c0;--ok:#4ade80;--bad:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:15px system-ui,sans-serif;padding-bottom:72px}
header{position:sticky;top:0;z-index:5;background:#0b1220ee;backdrop-filter:blur(8px);padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.bal{font-size:22px;font-weight:700;color:var(--ice)}.mut{color:var(--mut);font-size:13px}
main{padding:14px;max-width:520px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h3{margin:0 0 10px;font-size:16px}
button{font:inherit;color:var(--txt);background:#1b2a47;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
button.main{background:linear-gradient(135deg,#0ea5e9,#6366f1);border:0;font-weight:600;width:100%;padding:14px}
button:disabled{opacity:.5}button.on{outline:2px solid var(--ice)}
input{font:inherit;width:100%;background:#0b1220;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0b1220;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:12px 0;font-size:20px}
nav button.on{outline:0;color:var(--ice);background:#131c31}
.stage{font-size:34px;text-align:center;padding:18px 0;min-height:76px}
.res{text-align:center;min-height:22px;font-weight:600}
.top{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.tab{display:none}.tab.on{display:block}
#wrap{overflow:auto;height:48vh;border:1px solid var(--line);border-radius:10px;background:#fff}
#board{position:relative;width:max-content}#cv{display:block;image-rendering:pixelated}
#mk{position:absolute;border:2px solid #f43f5e;pointer-events:none;display:none}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#1b2a47;border:1px solid var(--ice);padding:10px 16px;border-radius:12px;opacity:0;transition:.2s;z-index:9;pointer-events:none}
</style></head><body>
<header><div><div class="mut" id="nm">…</div><div class="mut" id="lg"></div></div><div class="bal" id="bal">0 ❄️</div></header>
<main>
<div id="err" class="card" style="display:none"></div>

<section class="tab on" id="t-home">
 <div class="card"><h3>⛏ Фарм</h3><button class="main" id="farm">Фармить</button>
  <p class="mut" id="lv"></p></div>
 <div class="card"><h3>🔥 Сжечь ICE</h3><input id="burn" type="number" min="1" placeholder="Сколько сжечь">
  <div class="row"><button id="bb">Сжечь</button></div><p class="mut" id="br"></p></div>
</section>

<section class="tab" id="t-game">
 <div class="card"><h3>Ставка (ICE)</h3><input id="bet" type="number" min="1" max="500" value="10">
  <div class="row"><button onclick="sb(10)">10</button><button onclick="sb(50)">50</button><button onclick="sb(100)">100</button><button onclick="sb(500)">500</button></div></div>
 <div class="card"><div class="stage" id="stage">🎲</div><div class="res" id="res"></div></div>
 <div class="card"><h3>🪙 Орёл / Решка · x1.9</h3><div class="row"><button class="g" onclick="play('flip','heads')">🦅 Орёл</button><button class="g" onclick="play('flip','tails')">❄️ Решка</button></div></div>
 <div class="card"><h3>🎲 Кубик · x1.9</h3><div class="row"><button class="g" onclick="play('dice','low')">1–3</button><button class="g" onclick="play('dice','high')">4–6</button></div></div>
 <div class="card"><h3>🎰 Слоты · 3 одинаковых x10, 2 — x1.2</h3><button class="main g" onclick="play('slots')">Крутить</button></div>
 <div class="card"><h3>📈 Краш · выигрыш, если крэш ≥ цели</h3><div class="row"><input id="tg" type="number" step="0.1" min="1.1" max="100" value="2"><button class="g" onclick="play('crash',$('#tg').value)">Играть</button></div></div>
</section>

<section class="tab" id="t-top"><div class="card"><h3>🏆 Лидеры</h3>
 <div class="row" id="tf"></div><div id="tl" style="margin-top:8px"></div></div></section>

<section class="tab" id="t-px"><div class="card"><h3>🎨 Пиксель-карта 500×500</h3>
 <div id="wrap"><div id="board"><canvas id="cv" width="500" height="500"></canvas><div id="mk"></div></div></div>
 <div class="row"><button onclick="zm(-1)">−</button><input type="color" id="col" value="#38bdf8" style="padding:2px;height:42px"><button onclick="zm(1)">+</button></div>
 <p class="mut" id="pi">Тапни по карте, чтобы выбрать пиксель</p>
 <button class="main" id="pp">Поставить пиксель</button></div></section>
</main>
<nav><button class="on" data-t="home">🏠</button><button data-t="game">🎲</button><button data-t="top">🏆</button><button data-t="px">🎨</button></nav>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand();tg.setHeaderColor&&tg.setHeaderColor('#0b1220');tg.setBackgroundColor&&tg.setBackgroundColor('#0b1220');}
const LG=[[0,'🥉 Бронза'],[50,'🥈 Серебро'],[150,'🥇 Золото'],[300,'💎 Алмаз'],[600,'👑 Мастер'],[1000,'🌟 Легенда']];
const BR=[[0,'🧊 Лёд'],[100,'🔥 Горящий'],[500,'💀 Пепел'],[1000,'☄️ Метеор'],[5000,'🌋 Вулкан']];
const pick=(t,v)=>t.filter(x=>v>=x[0]).pop()[1];
const f=n=>(+n).toLocaleString('ru',{maximumFractionDigits:2});
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me=null,farmLeft=0,cdLeft=0,busy=false;
function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,2200);}
function hap(k){tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred(k);}
async function api(path,body){
  const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Init-Data':(tg&&tg.initData)||''},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw Object.assign(new Error(j.error||'Ошибка сервера'),{data:j,status:r.status});
  return j;
}
const tm=s=>{s=Math.max(0,s|0);return [s/3600|0,(s%3600)/60|0,s%60].map(x=>String(x).padStart(2,'0')).join(':');};
function draw(){
  $('#nm').textContent=me.first_name||me.username||'Игрок';
  $('#lg').textContent=pick(LG,me.rp)+' · '+me.rp+' RP · побед: '+me.wins;
  $('#bal').textContent=f(me.balance)+' ❄️';
  $('#lv').textContent='Уровень '+me.level+(me.is_vip?' · VIP':'')+' · курс ICE: '+me.ice_price;
  $('#br').textContent='Сожжено: '+f(me.total_burned)+' · '+pick(BR,me.total_burned);
  tick();
}
function tick(){
  if(!me)return;
  const b=$('#farm');b.disabled=farmLeft>0||busy;
  b.textContent=farmLeft>0?'⏳ '+tm(farmLeft):'⛏ Фармить';
  const p=$('#pp');p.disabled=cdLeft>0;p.textContent=cdLeft>0?'⏳ '+tm(cdLeft):'Поставить пиксель';
}
setInterval(()=>{if(farmLeft>0)farmLeft--;if(cdLeft>0)cdLeft--;tick();},1000);
async function loadMe(){
  try{me=await api('/api/user');draw();}
  catch(e){const x=$('#err');x.style.display='block';
    x.textContent=e.status===404?'Сначала нажми /start в боте, затем открой приложение снова.':e.status===401||e.status===403?'Открой приложение через Telegram-бота.':e.message;}
}
$('#farm').onclick=async()=>{
  try{const r=await api('/api/farm',{});me.balance=r.new_balance;farmLeft=10800;draw();hap('success');toast('+'+f(r.gained)+' ICE');}
  catch(e){if(e.data&&e.data.wait_sec)farmLeft=e.data.wait_sec;toast(e.message);tick();}
};
$('#bb').onclick=async()=>{
  const a=parseFloat($('#burn').value);if(!(a>=1))return toast('Минимум 1 ICE');
  try{const r=await api('/api/burn',{amount:a});me.balance=r.new_balance;me.total_burned=r.total_burned;draw();hap('success');toast('🔥 Сожжено '+f(r.burned));$('#burn').value='';}
  catch(e){toast(e.message);}
};
/* ---- игры (результат считает сервер) ---- */
function sb(v){$('#bet').value=v;}
const SYM=['❄️','🧊','💎','🔥','⭐'];
async function anim(g,r){
  const s=$('#stage'),x=r.result;
  if(g==='slots'){for(let i=0;i<10;i++){s.textContent=[0,1,2].map(()=>SYM[Math.random()*5|0]).join(' ');await sleep(90);}s.textContent=x.reels.join(' ');}
  else if(g==='dice'){for(let i=0;i<8;i++){s.textContent='🎲 '+(1+Math.random()*6|0);await sleep(80);}s.textContent='🎲 '+x.roll;}
  else if(g==='flip'){for(let i=0;i<6;i++){s.textContent=i%2?'🦅':'❄️';await sleep(100);}s.textContent=x.outcome==='heads'?'🦅 Орёл':'❄️ Решка';}
  else{let m=1;while(m<x.crash){m=Math.min(x.crash,m*1.06+.01);s.textContent='📈 x'+m.toFixed(2);await sleep(30);}s.textContent=(r.won?'📈 x':'💥 x')+x.crash.toFixed(2);}
}
async function play(game,choice){
  const bet=parseFloat($('#bet').value);if(!(bet>=1))return toast('Ставка от 1 ICE');
  if(busy)return;busy=true;document.querySelectorAll('.g').forEach(b=>b.disabled=true);$('#res').textContent='';
  try{
    const r=await api('/api/game/play',{game,bet,choice});
    await anim(game,r);
    me.balance=r.new_balance;me.wins=r.wins;me.rp=r.rp;draw();
    const e=$('#res');e.style.color=r.won?'var(--ok)':'var(--bad)';
    e.textContent=r.won?'🎉 +'+f(r.delta)+' ICE':'💥 −'+f(bet)+' ICE';hap(r.won?'success':'error');
  }catch(e){toast(e.message);}
  busy=false;document.querySelectorAll('.g').forEach(b=>b.disabled=false);tick();
}
/* ---- топ ---- */
const FL={balance:'💰',level:'⭐',wins:'🏅',rp:'🏆'};let tf='balance';
$('#tf').innerHTML=Object.keys(FL).map(k=>`<button data-f="${k}">${FL[k]}</button>`).join('');
$('#tf').onclick=e=>{if(e.target.dataset.f){tf=e.target.dataset.f;loadTop();}};
async function loadTop(){
  document.querySelectorAll('#tf button').forEach(b=>b.classList.toggle('on',b.dataset.f===tf));
  try{const r=await api('/api/top?field='+tf);
    $('#tl').innerHTML=r.top.map((u,i)=>`<div class="top"><span>${i+1}. ${esc(u.name)}</span><b>${f(u[tf])}</b></div>`).join('');}
  catch(e){toast(e.message);}
}
/* ---- пиксели ---- */
const cv=$('#cv'),ctx=cv.getContext('2d');let zoom=2,sel=null,pxLoaded=false;
function setZ(){cv.style.width=cv.style.height=(500*zoom)+'px';if(sel)mark();}
function zm(d){zoom=Math.min(10,Math.max(1,zoom+d*(zoom>=4?2:1)));setZ();}
function mark(){const m=$('#mk');m.style.cssText=`display:block;left:${sel[0]*zoom}px;top:${sel[1]*zoom}px;width:${zoom}px;height:${zoom}px`;}
cv.onclick=e=>{const r=cv.getBoundingClientRect();sel=[Math.floor((e.clientX-r.left)*500/r.width),Math.floor((e.clientY-r.top)*500/r.height)];mark();$('#pi').textContent='Выбран пиксель ('+sel[0]+', '+sel[1]+')';};
async function loadPx(){
  try{const r=await api('/api/pixels');ctx.fillStyle='#fff';ctx.fillRect(0,0,500,500);
    r.pixels.forEach(p=>{ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,1,1);});
    const c=await api('/api/pixel/cooldown');cdLeft=c.wait_sec||0;setZ();tick();}
  catch(e){toast(e.message);}
}
$('#pp').onclick=async()=>{
  if(!sel)return toast('Сначала выбери пиксель');
  try{const c=$('#col').value;await api('/api/pixel',{x:sel[0],y:sel[1],color:c});
    ctx.fillStyle=c;ctx.fillRect(sel[0],sel[1],1,1);cdLeft=600;tick();hap('success');}
  catch(e){if(e.data&&e.data.wait_sec)cdLeft=e.data.wait_sec;toast(e.message);tick();}
};
/* ---- вкладки ---- */
document.querySelector('nav').onclick=e=>{
  const t=e.target.dataset.t;if(!t)return;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b===e.target));
  document.querySelectorAll('.tab').forEach(s=>s.classList.toggle('on',s.id==='t-'+t));
  if(t==='top')loadTop();if(t==='px'&&!pxLoaded){pxLoaded=true;loadPx();}
};
loadMe();
</script></body></html>
